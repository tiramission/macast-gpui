name: Installer

# Build the Windows installer with crabnebula-dev/cargo-packager.
#
# Deliberately separate from ci.yml: this one compiles the release profile (much
# slower than `cargo check`), so it only runs on a tag or when started by hand
# from the Actions tab.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-installer:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # Pinned: the config in crates/macast-app/Cargo.toml targets the v0.11
      # schema, which is the version verified locally. NSIS itself is fetched
      # by cargo-packager on first use, so nothing else is needed here.
      - name: Install cargo-packager
        run: cargo install cargo-packager --locked --version 0.11.8

      # scripts/installer.ps1 builds the release binary, points GPUI_FXC_PATH at
      # the SDK's fxc.exe, and runs `cargo packager -p macast-app -f nsis -r`.
      #
      # The signing key is what makes the in-app updater work at all: the
      # manifest below advertises a minisign signature, and the app refuses to
      # install anything it cannot verify against the matching public key
      # (compiled into crates/macast-app/src/update.rs).
      - name: Build and sign installer
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD }}
        run: powershell -ExecutionPolicy Bypass -File scripts/installer.ps1

      # The manifest the app polls at releases/latest/download/latest.json: the
      # installer's download URL plus the signature of that exact file.
      - name: Write update manifest
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw "no installer in dist/" }
          $signature = Get-Content -Raw "$($installer.FullName).sig"
          $manifest = [ordered]@{
            version   = '${{ github.ref_name }}'.TrimStart('v')
            notes     = '更新内容见 GitHub 的 Release 页面。'
            pub_date  = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            url       = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$($installer.Name)"
            signature = $signature
            format    = 'nsis'
          }
          $manifest | ConvertTo-Json | Set-Content -NoNewline dist/latest.json
          Get-Content -Raw dist/latest.json

      - uses: actions/upload-artifact@v7
        with:
          name: macast-gpui-windows-installer
          path: |
            dist/*-setup.exe
            dist/*-setup.exe.sig
            dist/latest.json

      - name: Attach the installer to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*-setup.exe
            dist/*-setup.exe.sig
            dist/latest.json
          generate_release_notes: true
