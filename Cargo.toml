[workspace]
resolver = "2"
members = ["crates/macast-core", "crates/macast-app"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
dirs = "7"
socket2 = { version = "0.6", features = ["all"] }
if-addrs = "0.15"
rand = "0.9"
async-trait = "0.1"
anyhow = "1"
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
url = "2"

[profile.release]
opt-level = 2

# Media Foundation interop, kept in a dedicated crate so the huge
# Win32_Media_MediaFoundation feature never enters macast-app's windows
# compilation (which crashes rustc on this toolchain).
