[package]
name = "macast-app"
description = "gpui desktop app for the Macast-Gpui DLNA media renderer."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The crate stays `macast-app`, but the shipped binary is named after the
# product, so the exe, the installer and the zip all read `macast-gpui`.
# (cargo-packager derives the installer file name from the main binary, which
# is how `dist\macast-gpui_<version>_x64-setup.exe` gets its name.)
[[bin]]
name = "macast-gpui"
path = "src/main.rs"

# Installer packaging, consumed by crabnebula-dev/cargo-packager (v0.11):
#
#   cargo build --release -p macast-app -j 2    # build the release binary ...
#   cargo packager -p macast-app -f nsis -r     # ... then package it
#
# NSIS ships with cargo-packager, so no extra tooling is needed (unlike the
# WiX/MSI format, which needs the WiX Toolset installed).
[package.metadata.packager]
product_name = "Macast-Gpui"
identifier = "com.tiramission.macastgpui"
publisher = "tiramission"
description = "DLNA/UPnP MediaRenderer (cast receiver) built with Rust + gpui."
license_file = "../../LICENSE"
icons = ["assets/icon.ico"]
out_dir = "../../dist"

# Windows installer (NSIS). `installer-mode` defaults to per-user, so installing
# needs no admin rights; the default template already ships desktop + start menu
# shortcuts and the uninstall entry.
#
# `template` swaps in our copy of cargo-packager's .nsi (see nsis/installer.nsi):
# the stock template always installs per-user software into %LOCALAPPDATA% and
# remembers the previous install directory forever, which is how a stray
# %TEMP% path once showed up as the suggested target.
[package.metadata.packager.nsis]
installer-icon = "assets/icon.ico"
languages = ["SimpChinese", "English"]
display-language-selector = true
template = "nsis/installer.nsi"

[dependencies]
macast-core = { path = "../macast-core" }
log = "0.4"
image = "0.25"
gpui = "0.2.2"
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = "0.3"
arboard = "3"
url = { workspace = true }
alhazen-gpui = { version = "0.6", features = ["http", "media-foundation", "audio-output", "native"] }
# In-app updates. Pinned like cargo-packager itself: the crate speaks a fixed
# manifest/signature format, and its versions do not track the packager CLI.
cargo-packager-updater = "=0.2.3"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.26"
raw-window-handle = "0.6"
windows-registry = "0.5"
windows-core = "0.61"
windows-strings = "0.5"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

