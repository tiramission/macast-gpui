[package]
name = "macast-libmpv"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
macast-core = { path = "../macast-core" }
tracing = "0.1"
libmpv2 = "6.0"
libmpv2-sys = "4.0"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
