[package]
edition = "2024"
rust-version = "1.92"
name = "alhazen-core"
version = "0.6.0"
build = false
include = [
    "src/**",
    "examples/**",
    "LICENSE",
    "NOTICE",
    "README.md",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Native media engine for Rust: plays video and audio from files and HTTP, with pure-Rust and OS (GPU) decoders. UI-agnostic."
homepage = "https://github.com/alhazen-rs"
documentation = "https://docs.rs/alhazen-core"
readme = "README.md"
keywords = [
    "video",
    "audio",
    "media",
    "player",
    "decoder",
]
categories = [
    "multimedia::video",
    "multimedia::audio",
    "multimedia",
]
license = "Apache-2.0"
repository = "https://github.com/alhazen-rs/alhazen-core"

[features]
audio-output = ["dep:cpal"]
default = [
    "native",
    "http",
    "hls",
    "audio-output",
    "ffmpeg-cli",
    "media-foundation",
    "nvdec",
    "native-aac",
    "native-mp3",
]
ffmpeg-cli = ["dep:windows"]
hls = [
    "http",
    "native",
    "dep:aes",
    "dep:cbc",
]
http = ["dep:ureq"]
media-foundation = ["dep:windows"]
native = [
    "dep:rav1d",
    "dep:vp9-mt",
    "dep:oximedia-codec",
    "dep:oxideav-prores",
    "dep:re_mp4",
    "dep:opus-pure",
    "dep:lewton",
    "dep:claxon",
]
native-aac = ["dep:rusty_aac"]
native-mp3 = ["dep:rusty_mp3"]
nvdec = ["dep:libloading"]

[lib]
name = "alhazen_core"
path = "src/lib.rs"

[[example]]
name = "mf-check"
path = "examples/mf-check.rs"

[dependencies.aes]
version = "0.8"
optional = true

[dependencies.cbc]
version = "0.1"
features = ["alloc"]
optional = true

[dependencies.claxon]
version = "0.4.3"
optional = true

[dependencies.cpal]
version = "0.18"
optional = true

[dependencies.crossbeam-channel]
version = "0.5"

[dependencies.fast_image_resize]
version = "6"
features = ["rayon"]

[dependencies.lewton]
version = "0.10.2"
optional = true

[dependencies.libc]
version = "0.2"

[dependencies.log]
version = "0.4"

[dependencies.opus-pure]
version = "0.2.2"
optional = true

[dependencies.oxideav-prores]
version = "0.1.1"
optional = true

[dependencies.oximedia-codec]
version = "0.2.1"
features = ["vp8"]
optional = true
default-features = false

[dependencies.rayon]
version = "1.12"

[dependencies.re_mp4]
version = "0.5.1"
optional = true

[dependencies.rtrb]
version = "0.4"

[dependencies.rubato]
version = "5"

[dependencies.rusty_aac]
version = "1.1"
optional = true

[dependencies.rusty_mp3]
version = "=1.0.0"
optional = true

[dependencies.thiserror]
version = "2"

[dependencies.ureq]
version = "3.4"
optional = true

[dependencies.url]
version = "2.5"

[dependencies.vp9-mt]
version = "0.1.1"
optional = true

